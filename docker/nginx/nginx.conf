events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"endpoint":"public_http",'
        '"method":"$request_method",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;
    sendfile   on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream core_api {
        server core-api:8080;
    }

    upstream frontend {
        # The frontend Dockerfile must expose the Vite server on 5174.
        server frontend:5174;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /healthz {
            proxy_pass http://core_api/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /readyz {
            proxy_pass http://core_api/readyz;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Keep service documentation inside the Compose network and out of the gateway.
        location = /api/v1/openapi.json { return 404; }
        location = /api/v1/docs { return 404; }
        location = /openapi.json { return 404; }
        location = /docs { return 404; }
        location ^~ /docs/ { return 404; }
        location = /redoc { return 404; }
        location ^~ /redoc/ { return 404; }

        location /api/ {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }

        # Keep the documented P0 overview path while the deterministic demo
        # backend exposes the shorter /api/v1/analytics handler.
        location = /api/v1/analytics/overview {
            proxy_pass http://core_api/api/v1/analytics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }

        # ML endpoints are service-to-service only; never expose them through
        # the public application gateway.
        location /internal/ {
            return 404;
        }

        # SSE must not be buffered by the gateway.
        location = /api/v1/events {
            proxy_pass http://core_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
