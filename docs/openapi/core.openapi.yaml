        limit: { type: integer, minimum: 1, maximum: 100 }
        horizon_days: { type: integer, enum: [30, 60, 90], description: Forecast horizon; valid only for forecast intent. }
    AnalyticsQueryResponse:
      type: object
      required: [intent, summary, number, rows, table, table_columns, series, chart, filters, interpreted_filters, period, grouping, comparison, comparison_definition, generated_at, source, forecast_status, forecast_insufficient_history, forecast_start, forecast_model_version, forecast_model, forecast_horizon_days, forecast_history, forecast_points, expected_peaks, backtest]
