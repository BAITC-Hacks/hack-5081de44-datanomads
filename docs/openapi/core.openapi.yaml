          properties:
            type: { type: string, enum: [line, bar] }
            x: { type: string }
            y: { type: string }
            title: { type: string }
            forecast_start: { type: string, format: date, nullable: true }
        filters:
          type: object
          required: [region_id, topic_id, service_id, status, district, channel, range]
          properties:
            region_id: { type: string, nullable: true }
            topic_id: { type: string, nullable: true }
            service_id: { type: string, nullable: true }
            status: { type: string, nullable: true }
            district: { type: string, nullable: true }
            channel: { type: string, nullable: true }
            range: { type: string }
          additionalProperties: false
        interpreted_filters:
          type: object
          required: [region_id, topic_id, service_id, status, district, channel, range, group_by, limit, horizon_days]
          properties:
            region_id: { type: string, nullable: true }
            topic_id: { type: string, nullable: true }
            service_id: { type: string, nullable: true }
            status: { type: string, nullable: true }
            district: { type: string, nullable: true }
            channel: { type: string, nullable: true }
            range: { type: string }
            group_by: { type: string, enum: [none, region, topic, day, week, month] }
            limit: { type: integer, nullable: true }
            horizon_days: { type: integer, enum: [30, 60, 90], nullable: true }
          additionalProperties: false
        period:
          type: object
          required: [range, days, start, end]
