            end: { type: string, format: date-time }
        grouping: { type: string }
        comparison:
          type: object
          required: [type, current_total, previous_total, change_abs, change_pct, current_start, current_end, previous_start, previous_end]
          additionalProperties: false
          properties:
            type: { type: string, enum: [previous_equal_length_period] }
            current_total: { type: integer }
            previous_total: { type: integer }
            change_abs: { type: integer }
            change_pct: { type: number, nullable: true }
            current_start: { type: string, format: date-time }
            current_end: { type: string, format: date-time }
            previous_start: { type: string, format: date-time }
            previous_end: { type: string, format: date-time }
        comparison_definition: { type: string }
        generated_at: { type: string, format: date-time }
        source: { type: string }
        forecast_status: { type: string, nullable: true }
        forecast_insufficient_history: { type: boolean, nullable: true }
        forecast_start: { type: string, format: date, nullable: true }
        forecast_model_version: { type: string, nullable: true }
        forecast_model: { type: string, nullable: true }
        forecast_horizon_days: { type: integer, nullable: true }
        forecast_history: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        forecast_points: { type: array, nullable: true, items: { type: object, additionalProperties: true } }
        expected_peaks: { type: array, nullable: true, items: { type: string, format: date } }
        backtest: { type: object, nullable: true, additionalProperties: true }
    Alert:
