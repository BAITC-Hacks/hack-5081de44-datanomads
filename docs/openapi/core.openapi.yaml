        synthetic_ticket_count: { type: integer, minimum: 0 }
        real_ticket_count: { type: integer, minimum: 0 }
        unassigned_ticket_count: { type: integer, minimum: 0 }
        quarantined_row_count: { type: integer, minimum: 0 }
        dataset_version_count: { type: integer, minimum: 0 }
    AssistPreviewRequest:
      type: object
      description: Provide either ticket_id or text. Text previews may include a clarification answer for a transient recommendation; they do not update the source ticket or send messages to the CRM.
      properties:
        ticket_id: { type: string }
        text: { type: string, minLength: 1, maxLength: 10000 }
        language: { type: string, enum: [RU, KZ, MIXED, UNKNOWN] }
        region_id: { type: string }
    AssistPreviewResponse:
      type: object
      required: [ticket, prediction, actionable_context, similar_tickets, duplicate_candidates, repeat_candidates, response_template, source, orchestration]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        prediction: { $ref: '#/components/schemas/Prediction' }
        actionable_context: { $ref: '#/components/schemas/ActionableContext' }
        similar_tickets: { type: array, items: { $ref: '#/components/schemas/SimilarTicket' } }
        duplicate_candidates: { type: array, items: { $ref: '#/components/schemas/SimilarTicket' } }
        repeat_candidates: { type: array, items: { $ref: '#/components/schemas/SimilarTicket' } }
        response_template:
          type: object
          required: [body, language, approved, source]
          properties:
            body: { type: string }
            language: { type: string, enum: [ru, kz] }
            approved: { type: boolean, description: True only for content explicitly approved by a manager or admin. This does not make the template an official CRM record. }
            source: { type: string, enum: [APPROVED_TEMPLATE, MANUAL_REQUIRED, UNAVAILABLE] }
            template_key: { type: string }
            topic_id: { type: string }
            service_id: { type: string }
            version: { type: integer, minimum: 1 }
        source: { type: string }
        orchestration: { $ref: '#/components/schemas/AssistOrchestration' }
    ActionableContext:
      type: object
      description: A targeted question is suggested only when an uncertain topic changes the rule-derived service or priority. It never sends or persists the clarification answer.
      required: [status, rule_id, reason, decision_critical_fields, options]
      properties:
        status: { type: string, enum: [suggested, not_needed, manual_review] }
        rule_id: { type: string, description: Stable rule identifier explaining why a question is suggested or withheld. }
        reason: { type: string }
        missing_fact: { type: string, enum: [topic] }
        question: { type: string }
        decision_critical_fields:
          type: array
          items: { type: string, enum: [service, priority] }
        options:
          type: array
          items: { $ref: '#/components/schemas/ActionableContextOption' }
    ActionableContextOption:
      type: object
      required: [topic_id, topic_label, service, priority]
      properties:
        topic_id: { type: string }
        topic_label: { type: string }
        service: { type: string }
        priority: { type: string }
    ResponseTemplateInput:
      type: object
      additionalProperties: false
      required: [template_key, language, topic_id, service_id, body]
      properties:
        template_key: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$' }
        language: { type: string, enum: [RU, KZ] }
        topic_id: { type: string, minLength: 1, maxLength: 100 }
        service_id: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 4000, description: 'Only {{topic}}, {{service}}, and {{region}} variables are supported.' }
    ImportResponseTemplatesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ResponseTemplateInput' }
    UpdateResponseTemplateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    ResponseTemplateRecord:
      type: object
      required: [id, template_key, language, body, approved, version, created_at, updated_at]
      properties:
        id: { type: string }
        template_key: { type: string }
        language: { type: string, enum: [RU, KZ] }
        topic_id: { type: string, nullable: true }
        service_id: { type: string, nullable: true }
        body: { type: string }
        approved: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_by: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }
        approved_by: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResponseTemplatesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResponseTemplateRecord' }
    AssistOrchestration:
      type: object
      required: [request_id, trace_id, status, needs_review, language, latency_ms, model_versions, stages]
      properties:
        request_id: { type: string }
        trace_id:
          type: string
          description: Stable SHA-256 trace form shared with downstream services.
        status: { type: string, enum: [complete, partial] }
        needs_review: { type: boolean }
        language: { type: string, enum: [RU, KZ, MIXED, UNKNOWN] }
        latency_ms: { type: number, minimum: 0 }
        model_versions: { type: object, additionalProperties: { type: string } }
        stages: { type: array, items: { $ref: '#/components/schemas/AssistStage' } }
    AssistStage:
      type: object
      required: [name, status, latency_ms]
      properties:
        name: { type: string, enum: [language, classification, routing, priority, retrieval, duplicate_repeat, response_template] }
        status: { type: string, enum: [completed, partial, manual, unavailable, skipped, unknown] }
        latency_ms: { type: number, minimum: 0 }
        model_version: { type: string }
        error_code: { type: string }
    Prediction:
      type: object
      required: [ticket_id, model_version, topic_id, topic_label, confidence, confidence_state, recommended_service, predicted_priority, routing_reason, service_provenance, priority_provenance, alternatives, created_at]
      properties:
        ticket_id: { type: string }
        model_version: { type: string }
        topic_id: { type: string }
        topic_label: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidence_state: { type: string, enum: [confident, uncertain, low_confidence, unavailable, high, medium, low] }
        recommended_service: { type: string }
        predicted_priority: { type: string }
        routing_reason: { type: string }
        service_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        priority_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        alternatives: { type: array, items: { type: object, additionalProperties: true } }
        created_at: { type: string, format: date-time }
    RuleProvenance:
      type: object
      description: Per-field source for a routing or priority recommendation or operator decision.
      required: [source, version, reason]
      properties:
        source:
          type: string
          enum: [OFFICIAL, LABEL_HISTORY, MANUAL]
          description: OFFICIAL is reserved for provisioned verified rules; demo defaults and operator decisions are MANUAL.
        version: { type: integer, minimum: 1, nullable: true, description: Null for direct historical labels and operator decisions. }
        reason: { type: string }
        facts_used:
          type: array
          description: Exact structured values used by the routing or priority lookup. Omitted when no facts were captured.
          items: { $ref: '#/components/schemas/ExplainabilityFact' }
    ExplainabilityFact:
      type: object
      required: [field, value]
      properties:
        field: { type: string, enum: [topic_id, region_id] }
        value: { type: string }
    DecisionRequest:
      type: object
      properties:
        topic_id: { type: string }
        service: { type: string, description: Operator-selected service id or name. }
        priority: { type: string, enum: [critical, high, medium, low] }
        note: { type: string, maxLength: 2000 }
    OperatorDecision:
      type: object
      required: [id, ticket_id, action, predicted_topic_id, confirmed_topic_id, confirmed_topic_label, service, priority, service_provenance, priority_provenance, note, user_id, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        action: { type: string, enum: [confirm, correct] }
        predicted_topic_id: { type: string }
        predicted_service: { type: string, description: Original routing recommendation captured with this decision. }
        predicted_priority: { type: string, description: Original priority recommendation captured with this decision. }
        model_version: { type: string, description: Model version that produced the original prediction. }
        confirmed_topic_id: { type: string }
        confirmed_topic_label: { type: string, description: Human-readable label for the operator-confirmed topic. }
        service: { type: string }
        priority: { type: string }
        service_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        priority_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        note: { type: string, nullable: true }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
    TicketDetailResponse:
      type: object
      required: [ticket, prediction, latest_decision]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        prediction: { $ref: '#/components/schemas/Prediction' }
        latest_decision:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OperatorDecision'
    ContextHandoffEvidenceReference:
      type: object
      required: [source_type, record_id, field, label]
      properties:
        source_type: { type: string, enum: [ticket, operator_decision] }
        record_id: { type: string }
        field: { type: string }
        label: { type: string }
    ContextHandoffFact:
      type: object
      required: [label, value, evidence]
      properties:
        label: { type: string }
        value: { type: string }
        evidence: { $ref: '#/components/schemas/ContextHandoffEvidenceReference' }
    ContextHandoffLocation:
      type: object
      required: [region_id, region_name, district, address, object]
      properties:
        region_id: { type: string }
        region_name: { type: string }
        district: { type: string, nullable: true }
        address: { type: string, nullable: true }
        object: { type: string, nullable: true }
    ContextHandoffTiming:
      type: object
      required: [received_at, reported_since]
      properties:
        received_at: { type: string, format: date-time }
        reported_since: { type: string, nullable: true, description: No structured onset value is inferred from the ticket text. }
    ContextHandoffRoute:
      type: object
      required: [recommended_service, confirmed_service, operator_decision_id, explanation, provenance_source, provenance_version]
      properties:
        recommended_service: { type: string, nullable: true, description: Original route snapshot captured with the operator decision. }
        confirmed_service: { type: string }
        operator_decision_id: { type: string }
        explanation: { type: string }
        provenance_source: { type: string, enum: [OFFICIAL, LABEL_HISTORY, MANUAL] }
        provenance_version: { type: integer, nullable: true }
    ContextHandoffPackage:
      type: object
      required: [package_version, ticket_id, what_happened, where, when_or_since, scale, confirmed_facts, unknown_facts, route, linked_attachment_count, evidence_references]
      properties:
        package_version: { type: string, enum: [context-handoff.v1] }
        ticket_id: { type: string }
        what_happened: { type: string, description: Verbatim source ticket text, not an AI-generated summary. }
        where: { $ref: '#/components/schemas/ContextHandoffLocation' }
        when_or_since: { $ref: '#/components/schemas/ContextHandoffTiming' }
        scale: { type: string, nullable: true, description: No scale is inferred when a structured impact value is unavailable. }
        confirmed_facts:
          type: array
          items: { $ref: '#/components/schemas/ContextHandoffFact' }
        unknown_facts:
          type: array
          items: { type: string }
        route: { $ref: '#/components/schemas/ContextHandoffRoute' }
        linked_attachment_count: { type: integer, minimum: 0, description: Attachments remain available in the original ticket and are not copied into the package. }
        evidence_references:
          type: array
          items: { $ref: '#/components/schemas/ContextHandoffEvidenceReference' }
    DecisionResponse:
      type: object
      required: [ticket, prediction, decision, learning_feedback_status, learning_feedback_cycle_id]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        prediction: { $ref: '#/components/schemas/Prediction' }
        decision: { $ref: '#/components/schemas/OperatorDecision' }
        learning_feedback_status: { type: string, enum: [COLLECTED, NO_ACTIVE_COLLECT_CYCLE] }
        learning_feedback_cycle_id: { type: string, nullable: true }
    SimilarTicket:
      type: object
      required: [ticket_id, score, relation, topic_id, region_id, matched_factors, suggestion]
