components:
  securitySchemes:
    pulseRole:
      type: apiKey
      in: header
      name: x-pulse-role
      description: Demo role selector. Production identity comes from a trusted gateway.
  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RegionIdQuery:
      name: region_id
      in: query
      schema: { type: string }
    FromQuery:
      name: from
      in: query
      schema: { type: string, format: date-time }
    ToQuery:
      name: to
      in: query
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Role is not allowed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Requested resource was not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: State transition or dataset version conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    DependencyUnavailable:
      description: ML/Qdrant dependency unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unavailable:
      description: Required service or storage is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    AuditLogPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditLogEvent' }
        total: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
    AuditLogEvent:
      type: object
      required: [id, action, entity_type, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor_id: { type: string, nullable: true }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, nullable: true }
        request_id:
          type: string
          nullable: true
          description: Included only when generated by Core; untrusted values are redacted.
        created_at: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, not_ready] }
        service: { type: string }
        version: { type: string }
        storage: { type: string, enum: [postgres, in_memory_demo] }
        demo: { type: boolean }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ready, not_ready, not_evaluated, not_applicable] }
