components:
  securitySchemes:
    pulseRole:
      type: apiKey
      in: header
      name: x-pulse-role
      description: Demo role selector. Production identity comes from a trusted gateway.
  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RegionIdQuery:
      name: region_id
      in: query
      schema: { type: string }
    FromQuery:
      name: from
      in: query
      schema: { type: string, format: date-time }
    ToQuery:
      name: to
      in: query
      schema: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Role is not allowed
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: State transition or dataset version conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    DependencyUnavailable:
      description: ML/Qdrant dependency unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, degraded] }
        dependencies: { type: object, additionalProperties: { type: string } }
    ImportRequest:
      type: object
      required: [source_system, is_synthetic]
      properties:
        source_system: { type: string, minLength: 1 }
        source_uri: { type: string }
        dataset_version: { type: string }
        manifest_uri: { type: string }
        manifest_sha256: { type: string }
        is_synthetic: { type: boolean }
        tickets: { type: array, items: { type: object, additionalProperties: true } }
        quarantine: { type: array, items: { type: object, additionalProperties: true } }
    ImportResponse:
      type: object
      required: [import_run_id, source_system, dataset_version, total_rows, imported_rows, duplicate_rows, quarantined_rows, indexed_rows, is_synthetic, source]
      properties:
        import_run_id: { type: string }
        source_system: { type: string }
        dataset_version: { type: string }
        total_rows: { type: integer }
        imported_rows: { type: integer }
        duplicate_rows: { type: integer }
        quarantined_rows: { type: integer }
        indexed_rows: { type: integer }
        is_synthetic: { type: boolean }
        source: { type: string }
    DatasetProvenance:
      type: object
      required: [synthetic_ticket_count, real_ticket_count, unassigned_ticket_count, quarantined_row_count, dataset_version_count]
      properties:
        synthetic_ticket_count: { type: integer, minimum: 0 }
        real_ticket_count: { type: integer, minimum: 0 }
        unassigned_ticket_count: { type: integer, minimum: 0 }
        quarantined_row_count: { type: integer, minimum: 0 }
        dataset_version_count: { type: integer, minimum: 0 }
    AssistPreviewRequest:
      type: object
      description: Provide either ticket_id or text.
      properties:
        ticket_id: { type: string }
        text: { type: string, minLength: 1, maxLength: 10000 }
        language: { type: string, enum: [RU, KZ, MIXED, UNKNOWN] }
        region_id: { type: string }
    AssistPreviewResponse:
      type: object
      required: [ticket, prediction, similar_tickets, duplicate_candidates, repeat_candidates, response_template, source, orchestration]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        prediction: { $ref: '#/components/schemas/Prediction' }
        similar_tickets: { type: array, items: { $ref: '#/components/schemas/SimilarTicket' } }
        duplicate_candidates: { type: array, items: { $ref: '#/components/schemas/SimilarTicket' } }
        repeat_candidates: { type: array, items: { $ref: '#/components/schemas/SimilarTicket' } }
        response_template:
          type: object
          required: [body, language, approved, source]
          properties:
            body: { type: string }
            language: { type: string, enum: [ru, kz] }
            approved: { type: boolean, description: True only for content explicitly approved by a manager or admin. This does not make the template an official CRM record. }
            source: { type: string, enum: [APPROVED_TEMPLATE, MANUAL_REQUIRED, UNAVAILABLE] }
            template_key: { type: string }
            topic_id: { type: string }
            service_id: { type: string }
            version: { type: integer, minimum: 1 }
        source: { type: string }
        orchestration: { $ref: '#/components/schemas/AssistOrchestration' }
    ResponseTemplateInput:
      type: object
      additionalProperties: false
      required: [template_key, language, topic_id, service_id, body]
      properties:
        template_key: { type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$' }
        language: { type: string, enum: [RU, KZ] }
        topic_id: { type: string, minLength: 1, maxLength: 100 }
        service_id: { type: string, minLength: 1, maxLength: 100 }
        body: { type: string, minLength: 1, maxLength: 4000, description: 'Only {{topic}}, {{service}}, and {{region}} variables are supported.' }
    ImportResponseTemplatesRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/ResponseTemplateInput' }
    UpdateResponseTemplateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
    ResponseTemplateRecord:
      type: object
      required: [id, template_key, language, body, approved, version, created_at, updated_at]
      properties:
        id: { type: string }
        template_key: { type: string }
        language: { type: string, enum: [RU, KZ] }
        topic_id: { type: string, nullable: true }
        service_id: { type: string, nullable: true }
        body: { type: string }
        approved: { type: boolean }
        version: { type: integer, minimum: 1 }
        created_by: { type: string, nullable: true }
        updated_by: { type: string, nullable: true }
        approved_by: { type: string, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ResponseTemplatesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResponseTemplateRecord' }
    AssistOrchestration:
      type: object
      required: [request_id, trace_id, status, needs_review, language, latency_ms, model_versions, stages]
      properties:
        request_id: { type: string }
        trace_id: { type: string }
        status: { type: string, enum: [complete, partial] }
        needs_review: { type: boolean }
        language: { type: string, enum: [RU, KZ, MIXED, UNKNOWN] }
        latency_ms: { type: number, minimum: 0 }
        model_versions: { type: object, additionalProperties: { type: string } }
        stages: { type: array, items: { $ref: '#/components/schemas/AssistStage' } }
    AssistStage:
      type: object
      required: [name, status, latency_ms]
      properties:
        name: { type: string, enum: [language, classification, routing, priority, retrieval, duplicate_repeat, response_template] }
        status: { type: string, enum: [completed, partial, manual, unavailable, skipped, unknown] }
        latency_ms: { type: number, minimum: 0 }
        model_version: { type: string }
        error_code: { type: string }
    Prediction:
      type: object
      required: [ticket_id, model_version, topic_id, topic_label, confidence, confidence_state, recommended_service, predicted_priority, routing_reason, service_provenance, priority_provenance, alternatives, created_at]
      properties:
        ticket_id: { type: string }
        model_version: { type: string }
        topic_id: { type: string }
        topic_label: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        confidence_state: { type: string, enum: [confident, uncertain, low_confidence, unavailable, high, medium, low] }
        recommended_service: { type: string }
        predicted_priority: { type: string }
        routing_reason: { type: string }
        service_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        priority_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        alternatives: { type: array, items: { type: object, additionalProperties: true } }
        created_at: { type: string, format: date-time }
    RuleProvenance:
      type: object
      description: Per-field source for a routing or priority recommendation or operator decision.
      required: [source, version, reason]
      properties:
        source:
          type: string
          enum: [OFFICIAL, LABEL_HISTORY, MANUAL]
          description: OFFICIAL is reserved for provisioned verified rules; demo defaults and operator decisions are MANUAL.
        version: { type: integer, minimum: 1, nullable: true, description: Null for direct historical labels and operator decisions. }
        reason: { type: string }
    DecisionRequest:
      type: object
      properties:
        topic_id: { type: string }
        service: { type: string, description: Operator-selected service id or name. }
        priority: { type: string, enum: [critical, high, medium, low] }
        note: { type: string, maxLength: 2000 }
    OperatorDecision:
      type: object
      required: [id, ticket_id, action, predicted_topic_id, confirmed_topic_id, confirmed_topic_label, service, priority, service_provenance, priority_provenance, note, user_id, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        action: { type: string, enum: [confirm, correct] }
        predicted_topic_id: { type: string }
        predicted_service: { type: string, description: Original routing recommendation captured with this decision. }
        predicted_priority: { type: string, description: Original priority recommendation captured with this decision. }
        model_version: { type: string, description: Model version that produced the original prediction. }
        confirmed_topic_id: { type: string }
        confirmed_topic_label: { type: string, description: Human-readable label for the operator-confirmed topic. }
        service: { type: string }
        priority: { type: string }
        service_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        priority_provenance: { $ref: '#/components/schemas/RuleProvenance' }
        note: { type: string, nullable: true }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
    TicketDetailResponse:
      type: object
      required: [ticket, prediction, latest_decision]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        prediction: { $ref: '#/components/schemas/Prediction' }
        latest_decision:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OperatorDecision'
    DecisionResponse:
      type: object
      required: [ticket, prediction, decision]
      properties:
        ticket: { $ref: '#/components/schemas/Ticket' }
        prediction: { $ref: '#/components/schemas/Prediction' }
        decision: { $ref: '#/components/schemas/OperatorDecision' }
    SimilarTicket:
      type: object
      required: [ticket_id, score, relation, topic_id, region_id, matched_factors, suggestion]
      properties:
        ticket_id: { type: string }
        score: { type: number }
        relation: { type: string, enum: [duplicate, repeat, similar] }
        topic_id: { type: string }
        region_id: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        matched_factors:
          type: array
          items: { type: string, enum: [topic_match, region_match, within_30_days] }
        suggestion: { $ref: '#/components/schemas/RelationSuggestionSnapshot' }
    RelationSuggestionSnapshot:
      type: object
      required: [score, threshold, rule_version, model_version, distance_metric]
      properties:
        score: { type: number, minimum: 0, maximum: 1 }
        threshold: { type: number, minimum: 0, maximum: 1 }
        rule_version: { type: string }
        model_version: { type: string }
        distance_metric: { type: string, enum: [Cosine, Dot, Euclid, fixture] }
    PulseStateRequest:
      type: object
      required: [operator_confirmed_decision]
      properties:
        operator_confirmed_decision: { type: object, additionalProperties: true }
        feedback: { type: object, additionalProperties: true }
    RelationFeedbackRequest:
      type: object
      required: [relation, decision]
      properties:
        relation: { type: string, enum: [DUPLICATE, REPEAT, SIMILAR, UNRELATED, duplicate, repeat, similar, unrelated] }
        decision: { type: string, enum: [CONFIRMED, REJECTED, confirmed, rejected] }
        related_ticket_id: { type: string }
        suggestion: { $ref: '#/components/schemas/RelationSuggestionSnapshot' }
    RelationFeedbackResponse:
      type: object
      required: [id, ticket_id, cycle_id, feedback_type, comment, user_id, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        cycle_id: { type: string, nullable: true }
        feedback_type: { type: string }
        comment: { type: string, nullable: true }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        suggestion: { $ref: '#/components/schemas/RelationSuggestionSnapshot' }
    StoredResponse:
      type: object
      required: [status, request_id]
      properties:
        status: { type: string }
        request_id: { type: string }
        id: { type: string }
    TicketListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Ticket:
      type: object
      required: [id, text, region_id, topic_id, created_at]
      properties:
        id: { type: string }
        external_ref: { type: string }
        text: { type: string }
        language: { type: string }
        region_id: { type: string }
        region_name: { type: string }
        topic_id: { type: string }
        topic_label: { type: string }
        priority: { type: string }
        status: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    RuntimeMetrics:
      type: object
      required: [operator_decision_time_minutes, operator_decision_time_samples, classification_correction_rate, classification_corrections, classification_decisions, routing_correction_rate, routing_corrections, routing_decisions, priority_correction_rate, priority_corrections, priority_decisions, similarity_usefulness, similarity_feedback_count, duplicate_precision, duplicate_feedback_count]
      properties:
        operator_decision_time_minutes: { type: number, nullable: true, minimum: 0, description: Average minutes from ticket creation to the first operator decision; null when there are no samples. }
        operator_decision_time_samples: { type: integer, minimum: 0 }
        classification_correction_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        classification_corrections: { type: integer, minimum: 0 }
        classification_decisions: { type: integer, minimum: 0 }
        routing_correction_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        routing_corrections: { type: integer, minimum: 0 }
        routing_decisions: { type: integer, minimum: 0 }
        priority_correction_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        priority_corrections: { type: integer, minimum: 0 }
        priority_decisions: { type: integer, minimum: 0 }
        similarity_usefulness: { type: number, nullable: true, minimum: 0, maximum: 1, description: Confirmed relation feedback divided by all reviewed relation suggestions. }
        similarity_feedback_count: { type: integer, minimum: 0 }
        duplicate_precision: { type: number, nullable: true, minimum: 0, maximum: 1, description: Human-confirmed duplicate suggestions divided by reviewed duplicate suggestions. }
        duplicate_feedback_count: { type: integer, minimum: 0 }
    AnalyticsOverview:
      type: object
      required: [generated_at, source, range, overview, runtime_metrics, by_region, by_topic, time_series]
      properties:
        generated_at: { type: string, format: date-time }
        source: { type: string }
        range: { type: string }
        overview:
          type: object
          required: [total_tickets, open_tickets, resolved_tickets, high_priority_tickets, operator_decisions, confirmed_decisions, corrected_decisions, avg_decision_minutes, average_confidence]
          properties:
            total_tickets: { type: integer }
            open_tickets: { type: integer }
            resolved_tickets: { type: integer }
            high_priority_tickets: { type: integer }
            operator_decisions: { type: integer }
            confirmed_decisions: { type: integer }
            corrected_decisions: { type: integer }
            avg_decision_minutes: { type: number, nullable: true, minimum: 0 }
            average_confidence: { type: number }
            previous_total_tickets: { type: integer }
            change_abs: { type: integer }
            change_pct: { type: number, nullable: true }
        runtime_metrics: { $ref: '#/components/schemas/RuntimeMetrics' }
        by_region: { type: array, items: { type: object, additionalProperties: true } }
        by_topic: { type: array, items: { type: object, additionalProperties: true } }
        time_series: { type: array, items: { type: object, additionalProperties: true } }
    QueryIntent:
      type: object
      description: Provide either an allow-listed intent or a natural-language text question; Core infers and validates the same strict intent set.
      properties:
        intent: { type: string, enum: [count, trend, compare, compare_regions, top_topics, spikes, forecast] }
        text: { type: string, minLength: 1, maxLength: 500 }
        region_id: { type: string }
        topic_id: { type: string }
        range: { type: string, default: 7d }
        filters:
          type: object
          properties:
            region_id: { type: string }
            topic_id: { type: string }
            service_id: { type: string }
            status: { type: string }
            district: { type: string }
            channel: { type: string }
            range: { type: string }
          additionalProperties: false
        group_by: { type: string, enum: [region, topic, day, week, month] }
        limit: { type: integer, minimum: 1, maximum: 100 }
    AnalyticsQueryResponse:
      type: object
      required: [intent, number, rows, chart, filters]
      properties:
        intent: { type: string }
        number: { type: number }
        rows: { type: array, items: { type: object, additionalProperties: true } }
        table: { type: array, items: { type: object, additionalProperties: true } }
        series: { type: array, items: { type: object, additionalProperties: true } }
        chart: { type: object, additionalProperties: true }
        filters: { type: object, additionalProperties: true }
        interpreted_filters: { type: object, additionalProperties: true }
        source: { type: string }
    Alert:
      type: object
      required: [alert_id, status, severity]
      properties:
        alert_id: { type: string }
        status: { type: string, enum: [open, acknowledged, resolved] }
        severity: { type: string, enum: [info, warning, critical] }
        region_id: { type: string }
        topic_id: { type: string }
        metric: { type: string }
        observed_value: { type: number }
        baseline_value: { type: number }
    ForecastResponse:
      type: object
      required: [model_version]
      properties:
        source: { type: string }
        model_version: { type: string, description: Forecast provider version; never the embedding version. }
        model: { type: string }
        horizon_days: { type: integer }
        history: { type: array, items: { $ref: '#/components/schemas/TimeSeriesPoint' } }
        points: { type: array, items: { $ref: '#/components/schemas/TimeSeriesPoint' } }
        expected_peaks: { type: array, items: { type: string } }
    TimeSeriesPoint:
      type: object
      required: [date, tickets, resolved]
      properties:
        date: { type: string, format: date }
        tickets: { type: integer }
        resolved: { type: integer }
    LearningCycle:
      type: object
      required: [cycle_id, state, production_model_version]
      properties:
        cycle_id: { type: string }
        state: { type: string, enum: [COLLECT, TRAINING, EVALUATE, DECISION, PROMOTED, REJECTED] }
        production_model_version: { type: string }
        candidate_dataset_version: { type: string }
        candidate_model_version: { type: string }
        min_feedback_count: { type: integer }
    CandidateEvaluation:
      type: object
      properties:
        cycle_id: { type: string }
        offline_metrics: { type: object, additionalProperties: true }
        shadow_metrics: { type: object, additionalProperties: true }
        critical_regressions: { type: array, items: { type: string } }
        sample_size: { type: integer }
        decision: { type: string }
    ModelDecisionRequest:
      type: object
      required: [cycle_id, candidate_model_version, reason]
      properties:
        cycle_id: { type: string }
        candidate_model_version: { type: string }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ModelVersion:
      type: object
      required: [model_version, model_family, status]
      properties:
        model_version: { type: string }
        model_family: { type: string, enum: [classifier, embedder, forecast] }
        dataset_version: { type: string }
        artifact_checksum: { type: string }
        status: { type: string, enum: [candidate, production, rejected, archived] }
