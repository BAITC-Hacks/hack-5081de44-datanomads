          items: { $ref: '#/components/schemas/CandidateEvaluationGate' }
        decision: { type: string, enum: [PENDING_HUMAN_DECISION, PASS, FAIL, INSUFFICIENT_EVIDENCE] }
        evaluated_at: { type: string, format: date-time }
        synthetic: { type: boolean }
        candidate_comparisons:
          type: array
          items: { $ref: '#/components/schemas/CandidateEvaluationComparison' }
        evaluation_set: { $ref: '#/components/schemas/CandidateEvaluationSet' }
    CandidateEvaluationComparison:
      type: object
      additionalProperties: false
      required: [candidate_model_version, status, candidate_dataset_version, job_state, evaluation]
      properties:
        candidate_model_version: { type: string }
        status: { type: string, enum: [REGISTERED, EVALUATING, EVALUATED, EVALUATION_FAILED, PROMOTED, REJECTED] }
        candidate_dataset_version: { type: string, nullable: true }
        job_state: { type: string, nullable: true, enum: [QUEUED, RUNNING, COMPLETED, FAILED] }
        evaluation: { allOf: [{ $ref: '#/components/schemas/CandidateEvaluation' }], nullable: true }
    CandidateEvaluationSet:
      type: object
      additionalProperties: false
      required: [cycle_id, dataset_version, sample_count, window_started_at, window_ended_at]
      properties:
        cycle_id: { type: string }
        dataset_version: { type: string, nullable: true }
        sample_count: { type: integer, minimum: 0 }
        window_started_at: { type: string, format: date-time, nullable: true }
        window_ended_at: { type: string, format: date-time, nullable: true }
    CandidateEvaluation:
      description: Candidate evaluation evidence persisted by the Data/ML worker for one candidate.
      type: object
      additionalProperties: false
      required: [schema_version, status, cycle_id, candidate_model_version, production_model_version, candidate_dataset_version, evaluation_version, policy_version, promotion_policy, offline_evaluation, baseline_evaluation, shadow_evaluation, gates, decision, evaluated_at, synthetic]
      properties:
        schema_version: { type: string, const: candidate-evaluation.v1 }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        cycle_id: { type: string }
        candidate_model_version: { type: string }
        production_model_version: { type: string }
        candidate_dataset_version: { type: string }
        evaluation_version: { type: string }
        policy_version: { type: string }
        promotion_policy:
          type: object
          additionalProperties: false
          required: [version, thresholds]
          properties:
            version: { type: string }
            thresholds: { type: object, additionalProperties: { type: number } }
        offline_evaluation: { $ref: '#/components/schemas/CandidateModelEvaluation' }
        baseline_evaluation: { $ref: '#/components/schemas/CandidateModelEvaluation' }
        shadow_evaluation:
          type: object
          additionalProperties: false
          required: [sample_count, agreement_with_confirmed, correction_rate_delta, critical_regressions]
          properties:
            sample_count: { type: integer, minimum: 0 }
            agreement_with_confirmed: { type: number, nullable: true, minimum: 0, maximum: 1 }
            correction_rate_delta: { type: number, nullable: true }
            critical_regressions: { type: array, items: { type: string } }
            metrics: { type: object, additionalProperties: true }
            blind_ab: { type: string, enum: [DISABLED, ENABLED] }
        gates:
          type: array
          items: { $ref: '#/components/schemas/CandidateEvaluationGate' }
        decision: { type: string, enum: [PENDING_HUMAN_DECISION, PASS, FAIL, INSUFFICIENT_EVIDENCE] }
        evaluated_at: { type: string, format: date-time }
        synthetic: { type: boolean }
    CandidateModelEvaluation:
      type: object
      additionalProperties: false
      required: [schema_version, evaluation_id, model_type, model_version, dataset_version, evaluation_version, split_version, evaluation_type, status, sample_count, metrics, critical_regressions, created_at, synthetic]
      properties:
        schema_version: { type: string, const: model-evaluation.v1 }
        evaluation_id: { type: string }
        model_type: { type: string, enum: [classifier, embedder, forecast, anomaly] }
        model_version: { type: string }
        dataset_version: { type: string }
        evaluation_version: { type: string }
        split_version: { type: string }
        evaluation_type: { type: string, enum: [OFFLINE, SHADOW, BACKTEST] }
        status: { type: string, enum: [COMPLETED, INSUFFICIENT_DATA, FAILED] }
        sample_count: { type: integer, minimum: 0 }
        metrics: { type: object, additionalProperties: true }
        critical_regressions: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        evaluator: { type: string, nullable: true }
        synthetic: { type: boolean }
    CandidateEvaluationGate:
      type: object
      additionalProperties: false
      required: [key, status]
      properties:
        key: { type: string }
        status: { type: string, enum: [PASSED, FAILED, INSUFFICIENT_EVIDENCE, PENDING] }
        observed: { type: number, nullable: true }
        threshold: { type: number, nullable: true }
        reason: { type: string }
    ModelVersion:
      type: object
      required: [model_version, model_family, status]
      properties:
        model_version: { type: string }
        model_family: { type: string, enum: [classifier, embedder, forecast] }
        dataset_version: { type: string }
        artifact_checksum: { type: string }
        status: { type: string, enum: [candidate, production, rejected, archived] }
    CompleteModelRolloutRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ModelRolloutMetrics:
      type: object
      required: [canary_ticket_count, canary_decision_count, failed_inference_count, candidate_correction_rate, production_correction_rate, correction_rate_delta]
      properties:
        canary_ticket_count: { type: integer, minimum: 0 }
        canary_decision_count: { type: integer, minimum: 0 }
        failed_inference_count: { type: integer, minimum: 0 }
        candidate_correction_rate: { type: number, nullable: true }
        production_correction_rate: { type: number, nullable: true }
        correction_rate_delta: { type: number, nullable: true }
    ModelRollout:
      type: object
      required: [rollout_id, status, candidate_model_version, previous_production_model_version, metrics]
      properties:
        rollout_id: { type: string }
        status: { type: string, enum: [CANARY, MONITORING, FULL_PRODUCTION, ROLLED_BACK, CANCELLED] }
        candidate_model_version: { type: string }
        previous_production_model_version: { type: string }
        canary_traffic_percent: { type: integer, minimum: 1, maximum: 25 }
        policy_version: { type: string }
        policy_snapshot: { type: object, additionalProperties: true }
        metrics: { $ref: '#/components/schemas/ModelRolloutMetrics' }
        full_rollout_eligible: { type: boolean }
        blocking_gates: { type: array, items: { type: string } }
    ModelRolloutPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ModelRollout' } }
        total: { type: integer, minimum: 0 }
    CompleteModelRolloutResponse:
      type: object
      required: [rollout_id, status, candidate_model_version, previous_production_model_version, metrics]
      properties:
        rollout_id: { type: string }
        status: { type: string, enum: [FULL_PRODUCTION] }
        candidate_model_version: { type: string }
        previous_production_model_version: { type: string }
        metrics: { $ref: '#/components/schemas/ModelRolloutMetrics' }
