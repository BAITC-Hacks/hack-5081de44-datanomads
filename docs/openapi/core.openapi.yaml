openapi: 3.0.3
info:
  title: Pulse 109 Core API
  version: 1.0.0
  description: >-
    Public application contract. Core API validates access and orchestrates
    PostgreSQL, Qdrant and the internal ML service. It never represents a
    write to the official 109 system. Demo mode accepts an optional x-pulse-role
    selector; non-demo mode requires identity headers from a trusted gateway.
servers:
  - url: http://localhost:8080
    description: Local Nginx gateway
tags:
  - name: system
  - name: import
  - name: assist
  - name: tickets
  - name: analytics
  - name: alerts
  - name: forecast
  - name: learning
  - name: models
paths:
  /healthz:
    get:
      tags: [system]
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /readyz:
    get:
      tags: [system]
      summary: Dependency readiness
      responses:
        '200':
          description: Required dependencies are ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Dependency is unavailable
  /api/v1/import:
    post:
      tags: [import]
      summary: Import a validated and minimized dataset into PostgreSQL and Qdrant
      description: Dataset versions are immutable. Quarantine row contents are redacted in PostgreSQL.
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '201':
          description: Import committed; repeated identical imports report duplicates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/datasets/provenance:
    get:
      tags: [import]
      summary: Read dataset provenance counts
      description: Aggregate counts label synthetic records and do not include ticket text or other ticket fields.
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Dataset provenance summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetProvenance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/preview:
    post:
      tags: [assist]
      summary: Build an operator assist preview
      security: [{ pulseRole: [] }, {}]
      parameters:
        - name: x-request-id
          in: header
          required: false
          schema: { type: string }
        - name: x-trace-id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistPreviewRequest' }
      responses:
        '200':
          description: Prediction and retrieval candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistPreviewResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/DependencyUnavailable' }
  /api/v1/response-templates:
    get:
      tags: [assist]
      summary: List response template versions
      description: Manager or admin only. Template bodies are reviewed separately from CRM records.
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Template versions, including pending drafts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseTemplatesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [assist]
      summary: Create a pending response template version
      description: Creation never approves content. A manager or admin must call the explicit approval route.
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResponseTemplateInput' }
      responses:
        '200':
          description: New pending version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseTemplateRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid JSON or an unknown request field }
  /api/v1/response-templates/import:
    post:
      tags: [assist]
      summary: Import pending response template versions
      description: The batch is atomic and all imported templates remain unapproved.
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportResponseTemplatesRequest' }
      responses:
        '200':
          description: Imported pending versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseTemplatesResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Invalid JSON or an unknown request field }
  /api/v1/response-templates/{template_id}:
    parameters:
      - name: template_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [assist]
      summary: Read a response template version
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Response template version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseTemplateRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [assist]
      summary: Edit a pending response template version
      description: Approved versions are immutable; create a new version to change approved copy.
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateResponseTemplateRequest' }
      responses:
        '200':
          description: Updated pending version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseTemplateRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Invalid JSON or an unknown request field }
    delete:
      tags: [assist]
      summary: Delete a pending response template version
      description: Approved versions cannot be deleted.
      security: [{ pulseRole: [] }, {}]
      responses:
        '204': { description: Pending version deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/response-templates/{template_id}/approve:
    parameters:
      - name: template_id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [assist]
      summary: Explicitly approve a response template version
      description: Records the manager or admin who approved this content and the approval time.
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Approved response template version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseTemplateRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tickets/{ticket_id}/pulse-state:
    put:
      tags: [tickets]
      summary: Store a human-confirmed Pulse decision
      security: [{ pulseRole: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulseStateRequest' }
      responses:
        '200':
          description: Pulse state stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tickets/{ticket_id}/relation-feedback:
    post:
      tags: [tickets]
      summary: Confirm or reject duplicate/repeat relation candidates
      security: [{ pulseRole: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationFeedbackRequest' }
      responses:
        '201':
          description: Feedback stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationFeedbackResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/overview:
    get:
      tags: [analytics]
      summary: Situation Center overview
      security: [{ pulseRole: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/RegionIdQuery'
        - name: topic_id
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
      responses:
        '200':
          description: Aggregated analytics slice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics:
    get:
      tags: [analytics]
      summary: Filtered PostgreSQL-backed Situation Center slice
      security: [{ pulseRole: [] }, {}]
      parameters:
        - $ref: '#/components/parameters/RegionIdQuery'
        - name: topic_id
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, default: 30d }
      responses:
        '200':
          description: Aggregated analytics slice with comparable period and series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/taxonomy:
    get:
      tags: [analytics]
      summary: Current taxonomy and available ticket filter values
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Regions, topics, services, statuses, districts and channels
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics/drilldown:
    get:
      tags: [analytics]
      summary: Drill an analytics metric down to source tickets
      description: Returns the PostgreSQL ticket rows behind a region, topic, date, alert or overview metric.
      security: [{ pulseRole: [] }, {}]
      parameters:
        - name: dimension
          in: query
          required: true
          schema: { type: string, enum: [overview, region, topic, date, alert] }
        - name: value
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/RegionIdQuery'
        - name: topic_id
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, default: 30d }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Source tickets for the selected analytics slice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics/query:
    post:
      tags: [analytics]
      summary: Execute a validated QueryIntent
      description: LLM, if used, produces intent only; Core API validates allow-listed parameters and executes parameterized queries.
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryIntent' }
      responses:
        '200':
          description: Number, table and chart-ready series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsQueryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: List active alerts
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Alert list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/events:
    get:
      tags: [analytics]
      summary: Server-sent updates
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Long-lived SSE stream. Starts with alerts.snapshot, then emits alerts.changed after alert updates and alerts.resync if events were missed; keep-alive comments are sent while idle.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/forecast:
    get:
      tags: [forecast]
      summary: Forecast 30, 60 and 90 days
      security: [{ pulseRole: [] }, {}]
      parameters:
        - name: horizon
          in: query
          schema: { type: integer, enum: [30, 60, 90] }
        - $ref: '#/components/parameters/RegionIdQuery'
        - name: topic_id
          in: query
          schema: { type: string }
        - name: service_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Forecast and expected peaks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics/export.pdf:
    get:
      tags: [analytics]
      summary: Export current analytics slice as PDF
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: PDF report
          content: { application/pdf: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/analytics/export.xlsx:
    get:
      tags: [analytics]
      summary: Export current analytics slice as XLSX
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: XLSX report
          content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/reports:
    get:
      tags: [analytics]
      summary: List generated report slices
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Ready report downloads
          content:
            application/json:
              schema:
                type: object
                required: [items, source]
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  source: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/learning/cycle:
    get:
      tags: [learning]
      summary: Get current controlled learning cycle
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Learning cycle state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearningCycle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/learning/cycle/close:
    post:
      tags: [learning]
      summary: Close COLLECT and queue candidate training
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cycle_id: { type: string }
      responses:
        '202':
          description: Training job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/learning/candidate/evaluation:
    get:
      tags: [learning]
      summary: Read candidate evaluation
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Offline and shadow metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateEvaluation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/learning/candidate/promote:
    post:
      tags: [learning]
      summary: Human approval of a candidate
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelDecisionRequest' }
      responses:
        '200':
          description: Candidate promoted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/learning/candidate/reject:
    post:
      tags: [learning]
      summary: Human rejection of a candidate
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelDecisionRequest' }
      responses:
        '200':
          description: Candidate rejected; production is unchanged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/models:
    get:
      tags: [models]
      summary: List model versions and statuses
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Model registry entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/openapi.json:
    get:
      tags: [system]
      summary: Read the Core API route index
      responses:
        '200': { description: Request completed }
  /api/v1/docs:
    get:
      tags: [system]
      summary: Read the Core API route index
      responses:
        '200': { description: Request completed }
  /api/v1/tickets:
    get:
      tags: [tickets]
      summary: List permitted tickets
      security: [{ pulseRole: [] }, {}]
      responses:
        '200': { description: Request completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [tickets]
      summary: Create a normalized ticket with a separate prediction
      security: [{ pulseRole: [] }, {}]
      responses:
        '201': { description: Request completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tickets/{ticket_id}:
    get:
      tags: [tickets]
      summary: Get a ticket with prediction and latest operator decision
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Ticket, prediction and latest operator decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tickets/{ticket_id}/prediction:
    get:
      tags: [tickets]
      summary: Get the latest AI prediction
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
      security: [{ pulseRole: [] }, {}]
      responses:
        '200':
          description: Latest AI prediction with routing and priority provenance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prediction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/tickets/{ticket_id}/vector:
    delete:
      tags: [tickets]
      summary: Delete a ticket vector from Qdrant
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
      security: [{ pulseRole: [] }, {}]
      responses:
        '200': { description: Request completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/{ticket_id}/confirm:
    post:
      tags: [assist]
      summary: Confirm the prediction for a ticket
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Prediction and separately persisted operator decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/{ticket_id}/correct:
    post:
      tags: [assist]
      summary: Correct the prediction for a ticket
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
      security: [{ pulseRole: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Prediction and separately persisted operator decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/confirm:
    post:
      tags: [assist]
      summary: Confirm a ticket prediction using ticket_id in the body
      security: [{ pulseRole: [] }, {}]
      responses:
        '200': { description: Request completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/correct:
    post:
      tags: [assist]
      summary: Correct a ticket prediction using ticket_id in the body
      security: [{ pulseRole: [] }, {}]
      responses:
        '200': { description: Request completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/confirm/{ticket_id}:
    post:
      tags: [assist]
      summary: Alias for confirming a ticket prediction
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
      security: [{ pulseRole: [] }, {}]
      responses:
        '200': { description: Request completed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/assist/correct/{ticket_id}:
    post:
      tags: [assist]
      summary: Alias for correcting a ticket prediction
      parameters:
        - name: ticket_id
          in: path
          required: true
          schema: { type: string }
