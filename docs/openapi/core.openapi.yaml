      properties:
        id: { type: string }
        ticket_id: { type: string }
        cycle_id: { type: string, nullable: true }
        feedback_type: { type: string }
        comment: { type: string, nullable: true }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        suggestion: { $ref: '#/components/schemas/RelationSuggestionSnapshot' }
    CreateRoutingFeedbackRequest:
      type: object
      additionalProperties: false
      required: [service_feedback]
      properties:
        service_feedback: { type: string, enum: [ACCEPTED, CORRECTED] }
        corrected_target_service:
          type: string
          maxLength: 128
          description: Active service id or label; required only for CORRECTED feedback.
    RoutingFeedbackRecord:
      type: object
      required: [id, ticket_id, operator_decision_id, original_route_recommendation, operator_confirmed_route, service_feedback, actor_user_id, source_system, evaluation_status, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        operator_decision_id: { type: string }
        original_route_recommendation: { type: string }
        operator_confirmed_route: { type: string }
        service_feedback: { type: string, enum: [ACCEPTED, CORRECTED] }
        corrected_target_service: { type: string, nullable: true }
        actor_user_id: { type: string }
        source_system: { type: string, enum: [DEMO_SIMULATION] }
        evaluation_status: { type: string, enum: [PENDING_OFFLINE_REVIEW] }
        created_at: { type: string, format: date-time }
    RoutingFeedbackListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RoutingFeedbackRecord' }
    CreateOutcomeVerificationRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { type: string, enum: [VERIFIED, PARTIAL, DISPUTED], description: UNKNOWN is derived from absent evidence and cannot be submitted. }
    OutcomeVerificationRecord:
      type: object
      required: [id, ticket_id, state, source_system, channel, actor_user_id, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        state: { type: string, enum: [VERIFIED, PARTIAL, DISPUTED] }
        source_system: { type: string, description: DEMO_SIMULATION for the currently connected operator-panel adapter. }
        channel: { type: string, description: OPERATOR_PANEL_SIMULATION for the current demo adapter. }
        actor_user_id: { type: string }
        created_at: { type: string, format: date-time }
    OutcomeVerificationSnapshot:
      type: object
      required: [ticket_id, official_ticket_status, state, latest, history]
      properties:
        ticket_id: { type: string }
        official_ticket_status: { type: string, description: Official status imported from CRM; it is not used to derive the Pulse verification state. }
        state: { type: string, enum: [UNKNOWN, VERIFIED, PARTIAL, DISPUTED], description: UNKNOWN when no outcome evidence exists. }
        latest:
          allOf:
            - $ref: '#/components/schemas/OutcomeVerificationRecord'
          nullable: true
        history:
          type: array
          items: { $ref: '#/components/schemas/OutcomeVerificationRecord' }
    StoredResponse:
      type: object
      required: [status, request_id]
      properties:
        status: { type: string }
        request_id: { type: string }
        id: { type: string }
    TicketListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AnalyticsDrilldownResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsDrilldownTicket' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AnalyticsDrilldownTicket:
      type: object
      required: [id, region_id, region_name, topic_id, topic_label, priority, status, created_at]
      properties:
        id: { type: string }
        region_id: { type: string }
        region_name: { type: string }
        topic_id: { type: string }
        topic_label: { type: string }
        priority: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Ticket:
      type: object
      required: [id, text, region_id, topic_id, created_at]
      properties:
        id: { type: string }
        external_ref: { type: string }
        text: { type: string }
        language: { type: string }
        region_id: { type: string }
        region_name: { type: string }
        topic_id: { type: string }
        topic_label: { type: string }
        priority: { type: string }
        status: { type: string }
        source: { type: string }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    RuntimeMetrics:
      type: object
      required: [operator_decision_time_minutes, operator_decision_time_samples, classification_correction_rate, classification_corrections, classification_decisions, routing_correction_rate, routing_corrections, routing_decisions, priority_correction_rate, priority_corrections, priority_decisions, similarity_usefulness, similarity_feedback_count, duplicate_precision, duplicate_feedback_count]
      properties:
        operator_decision_time_minutes: { type: number, nullable: true, minimum: 0, description: Average minutes from ticket creation to the first operator decision; null when there are no samples. }
        operator_decision_time_samples: { type: integer, minimum: 0 }
        classification_correction_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        classification_corrections: { type: integer, minimum: 0 }
        classification_decisions: { type: integer, minimum: 0 }
        routing_correction_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        routing_corrections: { type: integer, minimum: 0 }
        routing_decisions: { type: integer, minimum: 0 }
        priority_correction_rate: { type: number, nullable: true, minimum: 0, maximum: 1 }
        priority_corrections: { type: integer, minimum: 0 }
        priority_decisions: { type: integer, minimum: 0 }
        similarity_usefulness: { type: number, nullable: true, minimum: 0, maximum: 1, description: Confirmed relation feedback divided by all reviewed relation suggestions. }
        similarity_feedback_count: { type: integer, minimum: 0 }
        duplicate_precision: { type: number, nullable: true, minimum: 0, maximum: 1, description: Human-confirmed duplicate suggestions divided by reviewed duplicate suggestions. }
        duplicate_feedback_count: { type: integer, minimum: 0 }
    AnalyticsOverview:
      type: object
      required: [generated_at, source, range, overview, runtime_metrics, by_region, by_topic, time_series]
      properties:
        generated_at: { type: string, format: date-time }
        source: { type: string }
        range: { type: string }
        overview:
          type: object
          required: [total_tickets, open_tickets, resolved_tickets, high_priority_tickets, operator_decisions, confirmed_decisions, corrected_decisions, avg_decision_minutes, average_confidence]
          properties:
            total_tickets: { type: integer }
            open_tickets: { type: integer }
            resolved_tickets: { type: integer }
            high_priority_tickets: { type: integer }
            operator_decisions: { type: integer }
            confirmed_decisions: { type: integer }
            corrected_decisions: { type: integer }
            avg_decision_minutes: { type: number, nullable: true, minimum: 0 }
            average_confidence: { type: number }
            previous_total_tickets: { type: integer }
            change_abs: { type: integer }
            change_pct: { type: number, nullable: true }
        runtime_metrics: { $ref: '#/components/schemas/RuntimeMetrics' }
        by_region: { type: array, items: { type: object, additionalProperties: true } }
        by_topic: { type: array, items: { type: object, additionalProperties: true } }
        time_series: { type: array, items: { type: object, additionalProperties: true } }
    QueryIntent:
      type: object
      description: Provide exactly one allow-listed intent or a natural-language question. Core deterministically resolves the question and executes a parameterized analytics query; free-form SQL is not accepted.
      oneOf:
        - required: [intent]
        - required: [text]
        - required: [query]
      additionalProperties: false
      properties:
        intent: { type: string, enum: [count, trend, compare, compare_regions, top_topics, spikes, forecast] }
        text: { type: string, minLength: 1, maxLength: 500 }
        query: { type: string, minLength: 1, maxLength: 500, description: Compatibility alias for text. }
        region_id: { type: string }
        topic_id: { type: string }
        range: { type: string, pattern: '^([1-9]|[1-9][0-9]|[12][0-9]{2}|3[0-5][0-9]|36[0-6])d$', default: 30d, description: Day range from 1d through 366d. }
        filters:
          type: object
          properties:
            region_id: { type: string }
            topic_id: { type: string }
            service_id: { type: string }
            status: { type: string }
            district: { type: string }
            channel: { type: string }
