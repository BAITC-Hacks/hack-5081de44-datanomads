        dataset_version: { type: string }
        manifest_uri: { type: string }
        manifest_sha256: { type: string }
        is_synthetic: { type: boolean }
        tickets: { type: array, items: { type: object, additionalProperties: true } }
        quarantine: { type: array, items: { type: object, additionalProperties: true } }
    ImportResponse:
      type: object
      required: [import_run_id, source_system, dataset_version, total_rows, imported_rows, duplicate_rows, quarantined_rows, indexed_rows, is_synthetic, source]
      properties:
        import_run_id: { type: string }
        source_system: { type: string }
        dataset_version: { type: string }
        total_rows: { type: integer }
        imported_rows: { type: integer }
        duplicate_rows: { type: integer }
