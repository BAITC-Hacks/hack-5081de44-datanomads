          - INSUFFICIENT_FEEDBACK
          - TRAINER_NOT_CONFIGURED
          - FAILED
          title: State
        model_type:
          type: string
          title: Model Type
        dataset_version:
          type: string
          title: Dataset Version
        candidate_model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Candidate Model Version
