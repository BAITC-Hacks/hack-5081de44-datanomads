openapi: 3.0.3
info:
  title: Pulse 109 Internal ML API
  version: 1.0.0
  description: >-
    Private service-to-service contract. The API is reachable by Core API and
    the worker on the Compose network only; it is not a browser/public API.
servers:
  - url: http://ml-service:8000
    description: Compose network
tags:
  - name: system
  - name: inference
  - name: jobs
paths:
  /healthz:
    get:
      tags: [system]
      responses:
        '200':
          description: Process is alive
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
  /readyz:
    get:
      tags: [system]
      responses:
        '200':
          description: Model artifacts are loadable
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        '503': { description: Model artifact unavailable }
  /internal/v1/classify:
    post:
      tags: [inference]
      summary: Classify a normalized ticket text
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ClassifyRequest' } } }
      responses:
        '200':
          description: Prediction
          content: { application/json: { schema: { $ref: '#/components/schemas/ClassifyResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ModelUnavailable' }
  /internal/v1/embed:
    post:
      tags: [inference]
      summary: Create a ticket embedding
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EmbedRequest' } } }
      responses:
        '200':
          description: Embedding vector
          content: { application/json: { schema: { $ref: '#/components/schemas/EmbedResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /internal/v1/forecast:
    post:
      tags: [inference]
      summary: Forecast a time series
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ForecastRequest' } } }
      responses:
        '200':
          description: Forecast points and model metadata
          content: { application/json: { schema: { $ref: '#/components/schemas/ForecastResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /internal/v1/anomaly:
    post:
      tags: [inference]
      summary: Score region × topic observations for a spike
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnomalyRequest' } } }
      responses:
        '200':
          description: Anomaly score
          content: { application/json: { schema: { $ref: '#/components/schemas/AnomalyResponse' } } }
  /internal/v1/training/classifier:
    post:
      tags: [jobs]
      summary: Queue or execute offline classifier training
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrainingRequest' } } }
      responses:
        '202':
          description: Candidate training started
          content: { application/json: { schema: { $ref: '#/components/schemas/JobResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /internal/v1/training/embeddings:
    post:
      tags: [jobs]
      summary: Build/rebuild embeddings
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrainingRequest' } } }
      responses:
        '202':
          description: Embedding job accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/JobResponse' } } }
  /internal/v1/training/forecast:
    post:
      tags: [jobs]
      summary: Run forecast backtest/training
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TrainingRequest' } } }
      responses:
        '202':
          description: Forecast job accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/JobResponse' } } }
  /internal/v1/evaluation/classifier:
    post:
      tags: [jobs]
      summary: Evaluate production/candidate classifier on immutable split
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRequest' } } }
      responses:
        '200':
          description: Evaluation metrics
          content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationResponse' } } }
  /internal/v1/evaluation/embeddings:
    post:
      tags: [jobs]
      summary: Evaluate retrieval model
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRequest' } } }
      responses:
        '200':
          description: Retrieval metrics
          content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationResponse' } } }
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ModelUnavailable:
      description: Requested immutable artifact cannot be loaded
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code: { type: string }
        message: { type: string }
        request_id: { type: string }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready, degraded] }
        model_versions: { type: object, additionalProperties: { type: string } }
    ClassifyRequest:
      type: object
      required: [text, language, model_version]
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }
        language: { type: string, enum: [ru, kz, unknown] }
        model_version: { type: string }
        labels: { type: array, items: { type: string } }
    ClassifyResponse:
      type: object
      required: [label, confidence, model_version, needs_review]
      properties:
        label: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        alternatives: { type: array, items: { type: object, additionalProperties: true } }
        needs_review: { type: boolean }
        model_version: { type: string }
    EmbedRequest:
      type: object
      required: [text, model_version]
      properties:
        text: { type: string, minLength: 1, maxLength: 10000 }
        model_version: { type: string }
    EmbedResponse:
      type: object
      required: [vector, dimension, model_version]
      properties:
        vector: { type: array, items: { type: number } }
        dimension: { type: integer }
        model_version: { type: string }
    ForecastRequest:
      type: object
      required: [series, horizon_days, model_version]
      properties:
        series: { type: array, items: { type: object, additionalProperties: true }, minItems: 2 }
        horizon_days: { type: integer, enum: [30, 60, 90] }
        model_version: { type: string }
    ForecastResponse:
      type: object
      required: [points, model_version]
      properties:
        points: { type: array, items: { type: object, additionalProperties: true } }
        expected_peaks: { type: array, items: { type: object, additionalProperties: true } }
        model_version: { type: string }
    AnomalyRequest:
      type: object
      required: [observations]
      properties:
        observations: { type: array, items: { type: object, additionalProperties: true }, minItems: 1 }
        baseline_window: { type: integer, minimum: 1 }
    AnomalyResponse:
      type: object
      required: [score, is_anomaly]
      properties:
        score: { type: number }
        is_anomaly: { type: boolean }
        method: { type: string }
    TrainingRequest:
      type: object
      required: [dataset_version, requested_by]
      properties:
        dataset_version: { type: string }
        base_model: { type: string }
        requested_by: { type: string }
        config: { type: object, additionalProperties: true }
    JobResponse:
      type: object
      required: [job_id, state]
      properties:
        job_id: { type: string }
        state: { type: string, enum: [queued, running, completed, failed] }
        model_version: { type: string }
    EvaluationRequest:
      type: object
      required: [model_version, evaluation_version]
      properties:
        model_version: { type: string }
        baseline_model_version: { type: string }
        evaluation_version: { type: string }
        split_version: { type: string }
    EvaluationResponse:
      type: object
      required: [model_version, metrics, sample_size]
      properties:
        model_version: { type: string }
        metrics: { type: object, additionalProperties: true }
        critical_regressions: { type: array, items: { type: string } }
        sample_size: { type: integer }
