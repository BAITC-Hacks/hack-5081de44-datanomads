openapi: 3.1.0
info:
  title: Pulse 109 ML Service
  description: >-
    Local deterministic baseline for classification, retrieval embeddings,
    forecast and anomaly APIs. Classification returns topic signals only;
    Core owns routing and priority rules and exposes their source provenance.
    Core also determines possible recurrence from retrieval candidates and
    PostgreSQL status, closure time, topic and structured object; the ML service
    does not classify recurrence.
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags:
      - health
      summary: Model artifact and runtime readiness
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Model manifest and configured runtime are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Model manifest or runtime is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /:
    get:
      tags:
      - health
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Root  Get
  /internal/v1/classify:
    post:
      tags:
      - inference
      summary: Classify
      operationId: classify_internal_v1_classify_post
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          type: string
      - name: x-trace-id
        in: header
        required: false
        description: Core sends the SHA-256 trace form; other incoming values are hashed before logging.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/embed:
    post:
      tags:
      - inference
      summary: Embed
      operationId: embed_internal_v1_embed_post
      parameters:
      - name: x-request-id
        in: header
        required: false
        schema:
          type: string
      - name: x-trace-id
        in: header
        required: false
        description: Core sends the SHA-256 trace form; other incoming values are hashed before logging.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/forecast:
    post:
      tags:
      - inference
      summary: Forecast
      operationId: forecast_internal_v1_forecast_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForecastRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/anomaly:
    post:
      tags:
      - inference
      summary: Anomaly
      operationId: anomaly_internal_v1_anomaly_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnomalyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/models:
    get:
      tags:
      - models
      summary: Models
      operationId: models_internal_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelManifestResponse'
  /internal/v1/models/{model_type}:
    get:
      tags:
      - models
      summary: Model
      operationId: model_internal_v1_models__model_type__get
      parameters:
      - name: model_type
        in: path
        required: true
        schema:
          type: string
          title: Model Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelMetadata'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/metadata:
    get:
      tags:
      - models
      summary: Metadata
      operationId: metadata_internal_v1_metadata_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelManifestResponse'
  /internal/v1/training:
    post:
      tags:
      - training
      summary: Train a candidate from a supplied dataset
      description: >-
        In the controlled learning loop, the Core worker queues this operation
        only after a COLLECT cycle has reached its end time and minimum valid
        feedback count. PULSE_TEST_FAKE_TRAINER is reserved for integration
        tests and does not represent production training evidence.
      operationId: train_internal_v1_training_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/training/{model_type}:
    post:
      tags:
      - training
      summary: Train For Model
      operationId: train_for_model_internal_v1_training__model_type__post
      parameters:
      - name: model_type
        in: path
        required: true
        schema:
          type: string
          title: Model Type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/training/jobs/{job_id}:
    get:
      tags:
      - training
      summary: Training Job
      operationId: training_job_internal_v1_training_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/evaluation:
    post:
      tags:
      - evaluation
      summary: Evaluate
      operationId: evaluate_internal_v1_evaluation_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/evaluation/{model_type}:
    post:
      tags:
      - evaluation
      summary: Evaluate For Model
      operationId: evaluate_for_model_internal_v1_evaluation__model_type__post
      parameters:
      - name: model_type
        in: path
        required: true
        schema:
          type: string
          title: Model Type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/v1/evaluation/jobs/{evaluation_id}:
    get:
      tags:
      - evaluation
      summary: Evaluation Job
      operationId: evaluation_job_internal_v1_evaluation_jobs__evaluation_id__get
      parameters:
      - name: evaluation_id
        in: path
        required: true
        schema:
          type: string
          title: Evaluation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Alternative:
      properties:
        topic_id:
          type: string
          title: Topic Id
        topic:
          type: string
          title: Topic
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
      additionalProperties: true
      type: object
      required:
      - topic_id
      - topic
      - score
      - confidence
      title: Alternative
    AnomalyPoint:
      properties:
        index:
          type: integer
          title: Index
        value:
          type: number
          title: Value
        expected:
          type: number
          title: Expected
        score:
          type: number
          title: Score
        is_anomaly:
          type: boolean
          title: Is Anomaly
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: string
          - type: 'null'
          title: Timestamp
      additionalProperties: true
      type: object
      required:
      - index
      - value
      - expected
      - score
      - is_anomaly
      title: AnomalyPoint
    AnomalyRequest:
      properties:
        values:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Values
        history:
          anyOf:
          - items:
              $ref: '#/components/schemas/TimeSeriesPoint'
            type: array
          - type: 'null'
          title: History
        series:
          anyOf:
          - items:
              $ref: '#/components/schemas/TimeSeriesPoint'
            type: array
          - type: 'null'
          title: Series
        window:
          type: integer
          maximum: 366.0
          minimum: 2.0
          title: Window
          default: 7
        threshold:
          type: number
          maximum: 100.0
          exclusiveMinimum: 0.0
          title: Threshold
          default: 3.0
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
      additionalProperties: true
      type: object
      title: AnomalyRequest
    AnomalyResponse:
      properties:
        model_version:
          type: string
          title: Model Version
        threshold:
          type: number
          title: Threshold
        window:
          type: integer
          title: Window
        is_anomaly:
          type: boolean
          title: Is Anomaly
        latest:
          $ref: '#/components/schemas/AnomalyPoint'
        anomalies:
          items:
            $ref: '#/components/schemas/AnomalyPoint'
          type: array
          title: Anomalies
        points:
          items:
            $ref: '#/components/schemas/AnomalyPoint'
          type: array
          title: Points
      additionalProperties: true
      type: object
      required:
      - model_version
      - threshold
      - window
      - is_anomaly
      - latest
      - anomalies
      - points
      title: AnomalyResponse
    Classification:
      properties:
        language:
          type: string
          title: Language
        topic_id:
          type: string
          title: Topic Id
        topic:
          type: string
          title: Topic
        label:
          type: string
          title: Label
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        confidence_state:
          type: string
          enum:
          - CONFIDENT
          - UNCERTAIN
          - LOW_CONFIDENCE
          title: Confidence State
        needs_review:
          type: boolean
          title: Needs Review
        alternatives:
          items:
            $ref: '#/components/schemas/Alternative'
          type: array
          title: Alternatives
        model_version:
          type: string
          title: Model Version
      additionalProperties: true
      type: object
      required:
      - language
      - topic_id
      - topic
      - label
      - confidence
      - confidence_state
      - needs_review
      - model_version
      title: Classification
    ClassifyRequest:
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        texts:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Texts
        inputs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Inputs
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        top_k:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Top K
          default: 3
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
        expected_artifact_checksum:
          anyOf:
          - type: string
            pattern: '^sha256:[a-f0-9]{64}$'
          - type: 'null'
          title: Expected Artifact Checksum
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      additionalProperties: true
      type: object
      title: ClassifyRequest
    ClassifyResponse:
      properties:
        model_version:
          type: string
          title: Model Version
        predictions:
          items:
            $ref: '#/components/schemas/Classification'
          type: array
          title: Predictions
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        topic_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic Id
        topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Topic
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
        confidence_state:
          anyOf:
          - type: string
          - type: 'null'
          title: Confidence State
        needs_review:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Needs Review
        alternatives:
          items:
            $ref: '#/components/schemas/Alternative'
          type: array
          title: Alternatives
      additionalProperties: true
      type: object
      required:
      - model_version
      - predictions
      title: ClassifyResponse
    EmbedRequest:
      properties:
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        texts:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Texts
        inputs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Inputs
        dimension:
          type: integer
          maximum: 1024.0
          minimum: 8.0
          title: Dimension
          default: 32
        normalize:
          type: boolean
          title: Normalize
          default: true
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
      additionalProperties: true
      type: object
      title: EmbedRequest
    EmbedResponse:
      properties:
        model_version:
          type: string
          title: Model Version
        dimension:
          type: integer
          title: Dimension
        normalized:
          type: boolean
          title: Normalized
        embeddings:
          items:
            items:
              type: number
            type: array
          type: array
          title: Embeddings
        embedding:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Embedding
      additionalProperties: true
      type: object
      required:
      - model_version
      - dimension
      - normalized
      - embeddings
      title: EmbedResponse
    EvaluationRequest:
      properties:
        model_type:
          type: string
          title: Model Type
          default: classifier
        dataset_version:
          type: string
          title: Dataset Version
          default: demo-eval-v1
        samples:
          items:
            $ref: '#/components/schemas/TrainingSample'
          type: array
          title: Samples
        texts:
          items:
            type: string
          type: array
          title: Texts
        labels:
          items:
            type: string
          type: array
          title: Labels
        values:
          items:
            type: number
          type: array
          title: Values
        predictions:
          items:
            type: number
          type: array
          title: Predictions
        season_length:
          type: integer
          maximum: 366.0
          minimum: 1.0
          title: Season Length
          default: 7
      additionalProperties: true
      type: object
      title: EvaluationRequest
    EvaluationResponse:
      properties:
        evaluation_id:
          type: string
          title: Evaluation Id
        model_type:
          type: string
          title: Model Type
        dataset_version:
          type: string
          title: Dataset Version
        status:
          type: string
          enum:
          - COMPLETED
          - INSUFFICIENT_DATA
          title: Status
        sample_count:
          type: integer
          title: Sample Count
        metrics:
          type: object
          title: Metrics
        model_version:
          type: string
          title: Model Version
      additionalProperties: true
      type: object
      required:
      - evaluation_id
      - model_type
      - dataset_version
      - status
      - sample_count
      - model_version
      title: EvaluationResponse
    ForecastPoint:
      properties:
        index:
          type: integer
          title: Index
        value:
          type: number
          title: Value
        timestamp:
          anyOf:
          - type: string
            format: date-time
          - type: string
          - type: 'null'
          title: Timestamp
      additionalProperties: true
      type: object
      required:
      - index
      - value
      title: ForecastPoint
    ForecastRequest:
      properties:
        values:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Values
        history:
          anyOf:
          - items:
              $ref: '#/components/schemas/TimeSeriesPoint'
            type: array
          - type: 'null'
          title: History
        series:
          anyOf:
          - items:
              $ref: '#/components/schemas/TimeSeriesPoint'
            type: array
          - type: 'null'
          title: Series
        observations:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Observations
        horizon:
          type: integer
          maximum: 366.0
          minimum: 1.0
          title: Horizon
          default: 30
        season_length:
          type: integer
          maximum: 366.0
          minimum: 1.0
          title: Season Length
          default: 7
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
      additionalProperties: true
      type: object
      title: ForecastRequest
    ForecastResponse:
      properties:
        model_version:
          type: string
          title: Model Version
        model:
          type: string
          const: seasonal_naive
          title: Model
        status:
          type: string
          enum:
          - OK
          - INSUFFICIENT_HISTORY
          title: Status
          description: INSUFFICIENT_HISTORY is returned without forecast points or expected peaks.
        insufficient_history:
          type: boolean
          title: Insufficient History
        horizon:
          type: integer
          title: Horizon
        season_length:
          type: integer
          title: Season Length
        forecast:
          items:
            type: number
          type: array
          title: Forecast
          description: Seasonal naive values; empty when insufficient_history is true.
        points:
          items:
            $ref: '#/components/schemas/ForecastPoint'
          type: array
          title: Points
        expected_peaks:
          items:
            type: integer
          type: array
          title: Expected Peaks
          description: Peak indexes in forecast; empty when insufficient_history is true or all values are zero.
        backtest:
          additionalProperties:
            anyOf:
            - type: number
            - type: integer
            - type: 'null'
          type: object
          title: Backtest
      additionalProperties: true
      type: object
      required:
      - model_version
      - model
      - status
      - insufficient_history
      - horizon
      - season_length
      - forecast
      - points
      title: ForecastResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
          - not_ready
          title: Status
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
        model_versions:
          additionalProperties:
            type: string
          type: object
          title: Model Versions
        checks:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          type: object
          title: Checks
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: true
      type: object
      required:
      - status
      - service
      - version
      title: HealthResponse
    ModelManifestResponse:
      properties:
        schema_version:
          type: string
          const: model-manifest.v1
          title: Schema Version
        manifest_version:
          type: string
          title: Manifest Version
        service:
          type: string
          title: Service
        models:
          additionalProperties:
            $ref: '#/components/schemas/ModelMetadata'
          type: object
          title: Models
      additionalProperties: true
      type: object
      required:
      - schema_version
      - manifest_version
      - service
      - models
      title: ModelManifestResponse
    ModelMetadata:
      properties:
        schema_version:
          type: string
          enum:
          - model-metadata.v1
          - classifier-manifest.v1
          - embedder-manifest.v1
          title: Schema Version
        model_version:
          type: string
          title: Model Version
        model_family:
          type: string
          title: Model Family
        base_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Base Model
        dataset_version:
          type: string
          title: Dataset Version
        created_at:
          type: string
          title: Created At
        status:
          type: string
          enum:
          - CANDIDATE
          - PRODUCTION
          - REJECTED
          - ARCHIVED
          - DEMO_BASELINE
          title: Status
        artifact_kind:
          type: string
          enum:
          - TRAINED_ARTIFACT
          - DETERMINISTIC_BASELINE
          title: Artifact Kind
        artifact_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Uri
        metrics:
          type: object
          title: Metrics
        languages:
          items:
            type: string
          type: array
          title: Languages
        labels:
          items:
            type: string
          type: array
          title: Labels
        training_config:
          type: object
          title: Training Config
        artifact_checksum:
          anyOf:
          - type: string
          - type: 'null'
          title: Artifact Checksum
        demo_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Demo Artifact Id
        evaluation_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Evaluation Version
        synthetic:
          type: boolean
          title: Synthetic
        implementation:
          anyOf:
          - type: string
          - type: 'null'
          title: Implementation
        provenance:
          type: object
          title: Provenance
        dimension:
          anyOf:
          - type: integer
            maximum: 65536.0
            minimum: 1.0
          - type: 'null'
          title: Dimension
        distance_metric:
          anyOf:
          - type: string
            enum:
            - cosine
            - dot
            - euclidean
          - type: 'null'
          title: Distance Metric
        normalized:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Normalized
        preprocessing:
