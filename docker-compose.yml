name: pulse109

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_demo_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [pulse]

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [pulse]

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: pulse109/ml-service:local
    restart: unless-stopped
    environment:
      PULSE_ENV: ${PULSE_ENV:-demo}
      ML_HOST: 0.0.0.0
      ML_PORT: 8000
      MODEL_DIR: ${MODEL_DIR:-/app/trained-artifacts}
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      PULSE_TEST_FAKE_TRAINER: ${PULSE_TEST_FAKE_TRAINER:-false}
    volumes:
      - ml-artifacts:/app/trained-artifacts
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [pulse]

  ml-worker:
    image: pulse109/ml-service:local
    profiles: [demo]
    restart: unless-stopped
    # Keep a stable worker process in the demo image.  The same entrypoint can
    # execute one stdin job (without --loop) for deterministic offline checks.
    command: ["python", "/app/worker.py", "--loop"]
    environment:
      PULSE_ENV: ${PULSE_ENV:-demo}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse_demo_only}@postgres:5432/${POSTGRES_DB:-pulse}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-32}
      EMBEDDING_DISTANCE_METRIC: ${EMBEDDING_DISTANCE_METRIC:-cosine}
      EMBEDDER_VERSION: ${EMBEDDER_VERSION:-embedder-demo-2026-09-21-001}
      ML_SERVICE_URL: http://ml-service:8000
      MODEL_DIR: ${MODEL_DIR:-/app/trained-artifacts}
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
      PULSE_TEST_FAKE_TRAINER: ${PULSE_TEST_FAKE_TRAINER:-false}
    volumes:
      - ml-artifacts:/app/trained-artifacts
      - ./ml-service/worker.py:/app/worker.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks: [pulse]

  demo-seed:
    image: python:3.12-slim
    profiles: [demo]
    restart: "no"
    command: ["python", "/app/seed_demo.py"]
    environment:
      PULSE_ENV: ${PULSE_ENV:-demo}
      CORE_URL: http://core-api:8080
    volumes:
      - ./scripts/seed_demo.py:/app/seed_demo.py:ro
      - ./data/demo:/data/demo:ro
      - ./data/manifests:/data/manifests:ro
    depends_on:
      - core-api
    networks: [pulse]

  core-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pulse109/core-api:local
    restart: unless-stopped
    environment:
      PULSE_ENV: ${PULSE_ENV:-demo}
      PULSE_STORAGE: ${PULSE_STORAGE:-postgres}
      PULSE_HOST: 0.0.0.0
      PULSE_PORT: 8080
      PULSE_DEV_AUTH: ${PULSE_DEV_AUTH:-}
      PULSE_LEARNING_CYCLE_DURATION_HOURS: ${PULSE_LEARNING_CYCLE_DURATION_HOURS:-168}
      PULSE_LEARNING_MIN_FEEDBACK_COUNT: ${PULSE_LEARNING_MIN_FEEDBACK_COUNT:-1}
      PULSE_LEARNING_MANUAL_CLOSE: ${PULSE_LEARNING_MANUAL_CLOSE:-}
      PULSE_LEARNING_PROMOTION_POLICY_VERSION: ${PULSE_LEARNING_PROMOTION_POLICY_VERSION:-policy-v1}
      PULSE_LEARNING_EVALUATION_DATASET_VERSION: ${PULSE_LEARNING_EVALUATION_DATASET_VERSION:-}
      PULSE_TEST_FAKE_TRAINER: ${PULSE_TEST_FAKE_TRAINER:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulse}:${POSTGRES_PASSWORD:-pulse_demo_only}@postgres:5432/${POSTGRES_DB:-pulse}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-32}
      EMBEDDING_DISTANCE_METRIC: ${EMBEDDING_DISTANCE_METRIC:-cosine}
      EMBEDDER_VERSION: ${EMBEDDER_VERSION:-embedder-demo-2026-09-21-001}
      FORECAST_MODEL_VERSION: ${FORECAST_MODEL_VERSION:-forecast-statsforecast-seasonal-naive-2026-09-24-001}
      ML_SERVICE_URL: http://ml-service:8000
      RUST_LOG: ${RUST_LOG:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks: [pulse]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pulse109/frontend:local
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    expose:
      - "5174"
    depends_on:
      - core-api
    networks: [pulse]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - core-api
    networks: [pulse]

networks:
  pulse:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  ml-artifacts:
